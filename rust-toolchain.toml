# The one Rust this project builds with, here and in CI (standing rule
# 7: a gate that does not predict the build is not a gate — mailbox
# shipped a red commit because local clippy was 1.97 and CI's was 1.98).
# Raising it is a deliberate act: bump this channel and Cargo.toml's
# rust-version together, run the gates, fix what the newer clippy found.
[toolchain]
channel = "1.97"
components = ["rustfmt", "clippy"]
targets = ["x86_64-unknown-linux-musl"]
