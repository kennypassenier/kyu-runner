# The one Rust this project builds with, here and in CI (standing rule 7):
# a gate that does not predict the build is not a gate. Raising it is a
# deliberate act: bump the channel here and `rust-version` in Cargo.toml
# together, run the gates, fix what the newer clippy has learned.
#
# feat-build-1: releases are static musl builds, so the target is part of
# the pin. It belongs here and not in a `rustup target add` line: run
# before this file is in scope, that command installs the target against
# another toolchain instance and the build fails later without saying why
# (kyu, 2026-09-09).
[toolchain]
channel = "1.97"
components = ["rustfmt", "clippy"]
targets = ["x86_64-unknown-linux-musl"]
