# Dependency policy for T7 ("reluctant, policed"). Checked in CI on
# every push (advisories move without our code moving).

[advisories]
yanked = "deny"

[licenses]
# kyu-runner itself is MIT OR Apache-2.0 (T9); dependencies must be
# permissive. A copyleft dependency is a decision, not an accident:
# adding one requires editing this list in a reviewed commit.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
