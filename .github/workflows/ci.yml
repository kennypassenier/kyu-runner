name: CI

# Runs on every branch (standing rule 6a): branch protection waits for
# these checks, and a branch push that produced no checks could never be
# merged without a pull request. Written by `chassis new`; `chassis sync`
# shows the diff when the kit's version of this file changes.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# S7: the CI token only reads; publishing happens in release.yml.
permissions:
  contents: read

jobs:
  gates:
    name: fmt · clippy · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Project gates (.claude/hooks/gates.project.sh, when present)
        run: if [ -x .claude/hooks/gates.project.sh ]; then .claude/hooks/gates.project.sh; else echo "no project gates"; fi
      - name: The binary answers --version without configuration (AR20)
        run: cargo run -q -- --version

  deny:
    name: cargo-deny (advisories · licenses · bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check all

  image:
    name: container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build image
        run: docker build -t kyu-runner:ci .
      - name: The image answers --version and --healthcheck refuses a closed port
        run: |
          docker run --rm kyu-runner:ci --version
          if docker run --rm kyu-runner:ci --healthcheck http://127.0.0.1:1/healthz; then echo "healthcheck must fail against a closed port"; exit 1; fi
