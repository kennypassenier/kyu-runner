name: CI

# Runs on every branch (standing rule 6a): branch protection waits for
# these checks, and a branch push that produced no checks could never be
# merged without a pull request. Written by `chassis new`; `chassis sync`
# shows the diff when the kit's version of this file changes.
#
# The trigger was narrowed to `main` on 2026-09-09 and restored here on
# 2026-09-10, the same way chassis-rs restored its own. Measured while it
# was narrow: a push to branch `kit-2.0.0` produced zero runs with event
# `push`, a direct push to main was refused by branch protection, and
# `chassis release` hung waiting for checks of a `release-*` branch that
# CI never looked at — so 0.2.2 was released by hand through two pull
# requests. What that change was really after — one CI job instead of
# four — stays in place: `gates` below is the only one.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# S7: the CI token only reads; publishing happens in release.yml.
permissions:
  contents: read

jobs:
  gates:
    name: fmt · clippy · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master, 2026-09
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Project gates (.claude/hooks/gates.project.sh, when present)
        run: if [ -x .claude/hooks/gates.project.sh ]; then .claude/hooks/gates.project.sh; else echo "no project gates"; fi
      - name: The binary answers --version without configuration (AR20)
        run: cargo run -q -- --version
