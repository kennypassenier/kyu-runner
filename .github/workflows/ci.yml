name: CI

on:
  push:
  pull_request:

# Security F3: read-only token for CI; actions pinned to commit SHAs
# (a tag is mutable, a SHA is not).
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # rust-toolchain.toml pins the actual version (standing rule 7);
      # the action just makes sure rustup + components are present.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Lint (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      # G1 (Kenny, 2026-08-30): CI used to run without KYU_BIN, so the
      # drill that stops and restarts the hub skipped itself and "CI is
      # green" quietly excluded it. Lifting the binary out of the
      # published image gives CI the same hub this machine has.
      - name: Take the kyu binary out of the published image
        run: |
          image=ghcr.io/kennypassenier/kyu@sha256:13963aff9cb9b8449b19a51b209ef22661f7c174b1d9ddc8a88ef38240747177 # 2.0.0
          container=$(docker create "$image")
          docker cp "$container:/usr/local/bin/kyu" ./kyu
          docker rm "$container"
          chmod +x ./kyu
          ./kyu --version || true
      - name: Full test suite (E2E against the real hub binary)
        env:
          KYU_BIN: ${{ github.workspace }}/kyu
        run: cargo test --all

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
