# kyu-runner configuration. The copy in git is the source of truth
# (M3: state-in-git); the deployed file at /etc/kyu-runner/config.toml
# is just a copy — check drift with:
#   diff deploy/config.toml /etc/kyu-runner/config.toml
#
# The app token is NOT here: it lives in /etc/kyu-runner/kyu-runner.env
# (KYU_RUNNER_HUB_TOKEN=…), root-owned 0600, loaded by the systemd unit.
# This file is committed; a token in it would be a token in git.

# The hub runs on the same LXC, so localhost.
hub_url = "http://127.0.0.1:8080"

# MR1 (2026-08-30): the operational timings. Every value below is the
# built-in default — leave the whole block out and nothing changes. The
# numbers that are NOT here (the 1/2/4/8 s delivery retry ladder, the
# one settle retry, the health socket's accept pause) are pinned in the
# code on purpose: they are coupled to the lease budget or are
# busy-loop guards, each with the reason written next to it.
# [tuning]
# hub_backoff_ms = 500              # first pause when the hub is unreachable
# hub_backoff_max_ms = 30000        # longest pause between reconnect attempts
# circuit_probe_ms = 1000           # first pause while a webhook target is down
# circuit_probe_max_ms = 60000      # longest pause between probes
# circuit_probe_timeout_ms = 3000   # how long one TCP probe may take
# topic_unborn_poll_ms = 5000       # re-poll interval for a topic that does not exist yet
# route_respawn_ms = 5000           # pause before a crashed route loop restarts
# settle_timeout_ms = 5000          # ack/nack timeout; also the lease-budget margin

# W4: the observation socket (/healthz, /metrics) is the kit's and always
# listens; bind the address Uptime Kuma probes with KYU_RUNNER_LISTEN in the
# environment file (e.g. KYU_RUNNER_LISTEN=10.10.10.9:8082), not here.

# ── K6/P8 · the hub watches itself, the house sees it ──────────────────
# The hub's own events (message.dead_lettered, subscription.archived,
# …) become HA warnings. ORDER MATTERS: create the HA automation for
# this webhook FIRST, then deploy this route, then run the smoke test
# (operations runbook) — HA answers 200 even for unknown webhook ids,
# so a route enabled before its automation acks warnings into the void.
# Every HA webhook trigger for the runner sets local_only: true.
[[routes]]
name = "kyu-events"
topic = "kyu.events"
subscription = "ha-runner"
webhook_url = "http://homeassistant.lan:8123/api/webhook/hub_kyu_events"

# AR15: ops routes must survive long partial outages — while HA's HTTP
# stack answers errors (not down, not up), each message burns roughly
# one attempt per lease budget, so give them room. A policy write
# replaces every field: what stands here is the whole policy.
[routes.policy]
max_attempts = 25
