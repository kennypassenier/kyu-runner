# Journal budget for the LXC this service runs on (H4, Kenny 2026-09-05):
# the service itself writes no log files; journald owns rotation. Install as
# /etc/systemd/journald.conf.d/50-service.conf and `systemctl restart
# systemd-journald`. 200 MiB / one month on a 4 GB disk leaves room for the
# state and the pre-update copies.
[Journal]
SystemMaxUse=200M
SystemMaxFileSize=32M
MaxRetentionSec=1month
